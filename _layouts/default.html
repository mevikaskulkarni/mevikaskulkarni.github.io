<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% if page.title %}{{ page.title }} — Vikas Kulkarni{% else %}Vikas Kulkarni{% endif %}</title>
  {% seo %}
  <link rel="stylesheet" href="/portfolio.css" />
  <link rel="stylesheet" href="/blog.css" />
</head>

<body class="theme-dark">
  <div class="cursor-glow"></div>
  <div class="particles" id="particles"></div>

  <nav class="navbar">
    <div class="nav-shell">
      <a href="/" class="nav-logo" aria-label="Home"></a>

      <ul class="nav-menu" id="navMenu">
        <li><a href="/#home" class="nav-link">Home</a></li>
        <li><a href="/#about" class="nav-link">About</a></li>
        <li><a href="/#ongoing" class="nav-link">Ongoing</a></li>
        <li><a href="/#projects" class="nav-link">Projects</a></li>
        <li><a href="/#skills" class="nav-link">Skills</a></li>
        <li><a href="/blog.html" class="nav-link">Blog</a></li>
        <li><a href="/#contact" class="nav-link nav-cta">Contact</a></li>
      </ul>

      <button class="hamburger" id="hamburger" aria-label="Open menu" aria-expanded="false" type="button">
        <span></span><span></span><span></span>
      </button>
    </div>
  </nav>

  <main class="blog-main">
    {{ content }}
  </main>

  <footer class="footer">
    <div class="container">
      <p>&copy; 2025 Vikas Kulkarni. Built with passion and code.</p>
      <p class="footer-quote">"Everything's fun when code makes the real world move"</p>
    </div>
  </footer>

  <script src="/portfolio.js"></script>

  <script>
    (function () {
      const burger = document.getElementById('hamburger');
      const menu = document.getElementById('navMenu');
      if (!burger || !menu) return;

      const toggle = () => {
        const isOpen = menu.classList.toggle('active');
        burger.setAttribute('aria-expanded', isOpen ? 'true' : 'false');
      };

      burger.addEventListener('click', toggle);
      burger.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(); }
      });

      // close on link click (mobile)
      menu.addEventListener('click', (e) => {
        if (e.target.classList.contains('nav-link') && menu.classList.contains('active')) toggle();
      });
    })();
  </script>
</body>

</html>
